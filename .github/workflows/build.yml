name: Desktop builds
on:
  push:
    branches: [release]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build reproducible Linux environment
        run: docker compose build dev
      - name: Test and package AppImage with Gear Lever metadata
        run: >-
          docker compose run --rm
          -e GITHUB_REF_TYPE -e GITHUB_REF_NAME
          dev bash -c 'npm ci && node scripts/check-version.mjs && npm run check &&
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check &&
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings &&
          cargo test --locked --manifest-path src-tauri/Cargo.toml &&
          bash scripts/build-appimage.sh'
      - name: Exercise the desktop window in isolation
        run: |
          docker compose build ui-test
          docker compose run --rm ui-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            artifacts/*.AppImage
            artifacts/*.zsync
            artifacts/SHA256SUMS-linux.txt
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust
        run: rustup default 1.99.1
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build EXE and MSI installers
        run: npm run tauri -- build --bundles nsis,msi --ci -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the complete versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find artifacts -type f -print0)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --latest --title "Aurea Code $RELEASE_TAG" --generate-notes
