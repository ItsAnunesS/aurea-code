name: Desktop builds
on:
  push:
    branches: [release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate and embed the release version
        id: version
        if: github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
        run: node scripts/release-version.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Restore Linux compiler and package caches
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/registry
            .ci-cache/git
            .ci-cache/target
            !.ci-cache/target/release/bundle
            .ci-cache/npm
            .ci-cache/tauri
          key: linux-rust-v1-${{ hashFiles('Dockerfile', 'compose.ci.yaml') }}-${{ hashFiles('src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: linux-rust-v1-${{ hashFiles('Dockerfile', 'compose.ci.yaml') }}-
      - name: Build cached Linux development and test environment
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui-test
          load: true
          tags: |
            aurea-code-dev:latest
            aurea-code-ui-tests:latest
          cache-from: type=gha,scope=aurea-linux-env
          cache-to: type=gha,scope=aurea-linux-env,mode=max
      - name: Test and package AppImage with Gear Lever metadata
        run: >-
          docker compose -f compose.yaml -f compose.ci.yaml run --rm
          -e GITHUB_REF_TYPE -e GITHUB_REF_NAME
          dev bash -c 'npm ci && node scripts/check-version.mjs && npm test &&
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check &&
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings &&
          cargo test --locked --manifest-path src-tauri/Cargo.toml &&
          bash scripts/build-appimage.sh'
      - name: Test real database engines
        run: docker compose -f compose.yaml -f compose.ci.yaml --profile database-test run --rm database-test
      - name: Stop temporary database servers
        if: always()
        run: docker compose --profile database-test rm --stop --force db-postgres db-mysql db-mariadb
      - name: Exercise the desktop window in isolation
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm ui-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          compression-level: 0
          path: |
            artifacts/*.AppImage
            artifacts/*.zsync
            artifacts/SHA256SUMS-linux.txt
          if-no-files-found: error
      - name: Make container caches accessible to the runner
        if: always()
        run: if [ -d .ci-cache ]; then sudo chown -R "$(id -u):$(id -g)" .ci-cache; fi
  publish:
    needs: linux
    if: github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore the version embedded in the verified AppImage
        env:
          RELEASE_VERSION: ${{ needs.linux.outputs.version }}
        run: node scripts/release-version.mjs "$RELEASE_VERSION"
      - run: npm ci
      - name: Sign the verified AppImage and generate its update manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-release.mjs
      - name: Create the tag and publish the complete release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.linux.outputs.version }}
        with:
          script: await require('./scripts/publish-release.cjs')({ github, context });
