[package]
name = "aurea-code"
default-run = "aurea-code"
version = "0.2.1"
description = "Local IDE with workspaces, Git, and Docker"
authors = []
edition = "2021"
rust-version = "1.99"

[lib]
name = "aurea_code"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "sqlite"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
